<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--muted:#5b6b7f;--line:#dfe6ee;--soft:#eef3f9;--accent:#1f4e8c;--accent-ink:#fff;--accent-soft:#e3ecf8;
--a-bg:#dcf3e6;--a-ink:#17623a;--b-bg:#fff2cc;--b-ink:#7a5600;--c-bg:#eceff3;--c-ink:#4b5563;--r-bg:#fbe0e0;--r-ink:#8a1f1f;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent)}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:28px 16px 0}
.kicker{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
h1{font-size:28px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:78ch;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);font:600 14px Inter,system-ui,sans-serif;padding:12px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{display:inline-block;margin-left:6px;background:var(--soft);color:var(--muted);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
main{max-width:1240px;margin:0 auto;padding:24px 16px 72px}
.panel[hidden]{display:none}
h2{font-size:20px;margin:28px 0 12px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:22px 0 8px}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.bA{background:var(--a-bg);color:var(--a-ink)}.bB{background:var(--b-bg);color:var(--b-ink)}.bC{background:var(--c-bg);color:var(--c-ink)}.bR{background:var(--r-bg);color:var(--r-ink)}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar input,.toolbar select{font:14px Inter,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.toolbar input{flex:1 1 240px;min-width:0}
.toolbar .n{color:var(--muted);font-size:13px;margin-left:auto}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--soft);color:var(--muted);font-weight:600;font-size:12.5px;z-index:1;white-space:nowrap}
thead th.sort{cursor:pointer;user-select:none}
thead th.sort:after{content:" ↕";opacity:.4}
thead th.asc:after{content:" ↑";opacity:1}thead th.desc:after{content:" ↓";opacity:1}
tbody tr:hover td{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.wide{min-width:280px}td.mid{min-width:180px}
.doc{max-width:900px}
.doc p{margin:8px 0}
.doc ul{padding-left:20px;margin:8px 0}.doc li{margin:4px 0}
.doc .tw{max-height:none;margin:12px 0 18px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;box-shadow:var(--shadow)}
.acc summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"+";color:var(--muted);font-weight:400}
.acc[open] summary:after{content:"–"}
.acc .body{padding:0 16px 14px;color:var(--ink)}
.acc .body p{margin:6px 0}
.lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}
.toc{position:sticky;top:16px;align-self:start;font-size:13.5px;max-height:calc(100vh - 32px);overflow:auto}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 8px;border-left:2px solid var(--line)}
.toc a.l1{color:var(--ink);font-weight:600;margin-top:8px}
.toc a:hover{color:var(--accent);border-left-color:var(--accent)}
@media (max-width:860px){.layout{grid-template-columns:1fr}.toc{position:static;max-height:none}}
.q{display:grid;gap:10px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtext{font-weight:600;font-size:15px}
.qcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.qcols{grid-template-columns:1fr}}
.score{display:flex;gap:4px}
.score button{width:34px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.score button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sticky{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0}
.meter{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.files{display:grid;gap:10px}
.file{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.file a.t{font-weight:600;text-decoration:none}
.file small{color:var(--muted);display:block}
.bar{display:flex;align-items:center;gap:8px}
.bar i{display:block;height:8px;background:var(--accent);border-radius:999px;min-width:2px}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:13px}
.hl{background:var(--accent-soft);border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
</style>
</head>

s en 3 ans ; effectif presque doublé ; nouveaux laboratoires de développement précoce.", "Besoin d'analystes de développement."], ["LEO Pharma", "Vernouillet", "Pose de la première pierre de l'extension du laboratoire de contrôle qualité.", "Recrutements CQ à venir à l'ouverture."], ["Meribel Pharma Solutions", "Dreux", "Effectif passé de 90 à plus de 150 permanents en 3 ans, dont près d'une centaine en R&D.", "Croissance R&D analytique."], ["Delpharm Saint-Rémy", "Dreux", "Mission de transformation / remédiation publiée par un cabinet ; pharmacien libérateur en intérim.", "Besoin de profils seniors en investigation et conformité."], ["Stallergenes Greer", "Île-de-France", "125 M€ d'investissement industriel d'ici 2030, majoritairement à Antony.", "Compte à suivre."], ["Eurofins BPT", "Lyon", "Nouveau laboratoire de Lentilly (mars 2024) regroupant trois laboratoires.", "Sous-traitant en croissance."], ["bioMérieux", "Grenoble", "Bâtiment de 22 M€ ; ~320 salariés, objectif ~500.", "Renforts CQ au fil de la croissance."], ["Skyepharma", "Lyon", "Inspection ANSM réussie, certificats BPF renouvelés pour 2026.", "Site stable ; approche plus lente."]]}, {"t": "h1", "v": "5. Besoins potentiels et offres THE SKY"}, {"t": "table", "h": ["Besoin", "Indice", "Profil à proposer", "Comptes"], "r": [["Renfort analytique de routine", "Techniciens CQ en CDD ou séries de postes", "Junior / confirmé HPLC, GC, dissolution", "LFB, Cenexi, Eurofins Les Ulis, Seqens, LEO Pharma, Norgine, bioMérieux"], ["Intérim d'encadrement de laboratoire", "Poste de responsable / superviseur CQ ouvert", "Senior avec management", "Cooper, Seqens Limay, Cenexi, LFB, Stryker"], ["Investigations OOS / remédiation", "Coordinateur investigation, missions de remédiation", "Confirmé / senior investigations, intégrité des données", "Sanofi Marcy, Delpharm Saint-Rémy, LFB"], ["Développement et validation de méthodes", "Postes de développement analytique / MSAT", "Confirmé validation ICH Q2(R2)", "Ipsen Dreux, Boehringer, Servier, SGS"], ["Qualification / extension de laboratoire", "Extension du labo CQ, nouveaux équipements", "Technicien / ingénieur qualification", "Novo Nordisk, LEO Pharma, Curium"]]}, {"t": "h1", "v": "6. Concurrence observée"}, {"t": "p", "v": "22 offres de cabinets et d'ESN visent les mêmes zones, ce qui montre que les clients sous-traitent déjà ces besoins. Cabinets vus : Vulcain Engineering Group, CONSULTYS, MEENT, Calypse, ELITYS, COPHACLEAN, BIO15PHARMA, agap2, Expleo, Capgemini Engineering, fortil, Intertek France, House of ABY, Bilfinger Life Science. Les offres de BIO15PHARMA (Saint-Rémy-sur-Avre, Dreux, Lyon) et de COPHACLEAN (Mantes-la-Jolie) désignent des sites en recherche active de profils seniors."}, {"t": "h1", "v": "7. Prochaines actions"}, {"t": "ul", "v": ["Vérifier sur LinkedIn (compte connecté) le poste actuel des contacts de fiabilité B et C avant tout envoi.", "Écrire d'abord aux décideurs des comptes A en citant l'offre ou le projet du site (onglets Offres et Entreprises).", "Pour Novo Nordisk, Ipsen, Norgine et LEO Pharma : proposer un échange sur la montée en charge du laboratoire, avec 2 ou 3 profils disponibles.", "Relancer les offres sous 7 jours : les annonces LinkedIn de plus de 4 semaines sont souvent pourvues.", "Compléter les pistes sans URL (onglet Pistes) depuis un compte LinkedIn connecté."]}, {"t": "h1", "v": "8. Limites"}, {"t": "ul", "v": ["Les profils LinkedIn ne s'ouvrent pas sans compte : la fonction indiquée est celle du résultat de recherche public ou d'une publication.", "Les dates des offres sont relatives au 17/11/2026 ; une offre peut être pourvue sans être retirée.", "Mantes-la-Ville : aucun laboratoire CQ pharmaceutique trouvé ; seule Axalta (revêtements) y mène du contrôle analytique.", "Communes en limite de périphérie signalées : Épernon, Châteauneuf-en-Thymerais, Saint-Quentin-Fallavier, L'Arbresle."]}], "referentiel": [{"t": "h1", "v": "1. Niveaux d'expérience"}, {"t": "table", "h": ["Niveau", "Expérience", "Attendu"], "r": [["Junior", "0 à 2 ans", "Exécute des analyses de routine selon des procédures validées, sous supervision. Autonome sur une ou deux techniques."], ["Confirmé", "3 à 7 ans", "Autonome sur l'ensemble des techniques du laboratoire. Diagnostique les pannes, mène les investigations de phase I, réalise validations et transferts selon protocole."], ["Senior", "8 ans et plus", "Référent technique. Conçoit les stratégies de validation, pilote les investigations complexes, forme, défend le laboratoire en inspection, dialogue avec le client."]]}, {"t": "h1", "v": "2. Compétences par domaine"}, {"t": "table", "h": ["Domaine", "Junior", "Confirmé", "Senior"], "r": [["BPF, documentation et intégrité des données", "Applique les BPF (EU GMP Partie I, chap. 4 et 6) et les principes ALCOA+. Renseigne cahiers et fiches en temps réel, corrige selon les règles (rature simple, date, visa, motif).", "Relit et vérifie les dossiers analytiques d'un pair, y compris les audit trails. Rédige procédures et modes opératoires. Connaît Annexe 11, 21 CFR Part 11 et les guides intégrité des données (MHRA 2018, PIC/S PI 041-1).", "Conçoit le système documentaire du laboratoire, conduit des évaluations de risques intégrité des données, répond aux inspecteurs (ANSM, FDA) et pilote les plans de remédiation."], ["HPLC / UPLC", "Prépare phases mobiles, étalons et échantillons. Lance une séquence, vérifie la conformité du système (SST) et intègre selon la méthode. Reconnaît un chromatogramme anormal.", "Diagnostique les dérives (pression, temps de rétention, traînée, pics fantômes, dérive de ligne de base). Maîtrise les ajustements permis par Ph. Eur. 2.2.46 / USP <621>. Maîtrise les détecteurs UV/DAD, réfractométrie, fluorimétrie, et le dosage des substances apparentées.", "Développe et optimise des méthodes indicatrices de stabilité (dégradations forcées, pureté de pic, choix de colonne et de gradient). Maîtrise LC-MS, transposition HPLC vers UPLC, approche cycle de vie (ICH Q14)."], ["Chromatographie en phase gazeuse (GC)", "Réalise des analyses de routine (solvants résiduels par espace de tête, FID) selon méthode validée. Change septum et liner.", "Règle les paramètres d'espace de tête (température, temps d'équilibre), choisit la colonne, diagnostique fuites et contaminations. Applique ICH Q3C, Ph. Eur. 2.4.24 et USP <467>.", "Développe et valide des méthodes GC et GC-MS (impuretés volatiles, impuretés génotoxiques, nitrosamines). Justifie les limites à partir des expositions journalières admissibles (PDE)."], ["Dissolution", "Conduit un essai avec les appareils 1 (panier) et 2 (palette) : dégazage du milieu, 37 ± 0,5 °C, prélèvements aux temps prescrits, filtration, dosage UV ou HPLC.", "Interprète les niveaux S1, S2, S3 (Ph. Eur. 2.9.3 / USP <711>). Réalise la qualification mécanique et l'essai de vérification de performance. Investigue les résultats atypiques (cône, bulles, vibration, adsorption sur filtre). Établit des profils et calcule f2.", "Développe des méthodes discriminantes (choix du milieu, conditions sink, tensioactifs, appareils 3 et 4). Justifie les spécifications et soutient les dossiers de variation et de bioéquivalence."], ["Spectrophotométrie UV-Visible et infrarouge", "Réalise identifications IR (ATR, pastille KBr) et dosages UV selon monographie. Applique la loi de Beer-Lambert et respecte la zone de linéarité.", "Qualifie les appareils (exactitude en longueur d'onde et en absorbance, lumière parasite, résolution) selon Ph. Eur. 2.2.25 et 2.2.24 / USP <857>. Valide un dosage UV, gère les bibliothèques de spectres.", "Met en place des méthodes d'identification rapide (proche infrarouge, Raman) avec modèles chimiométriques, et leur validation."], ["Autres techniques physico-chimiques", "Karl Fischer volumétrique et coulométrique, pH, titrimétrie, perte à la dessiccation, conductivité, désagrégation, dureté, friabilité, uniformité de masse et de teneur.", "Carbone organique total, granulométrie laser, viscosité, osmolalité, point de fusion, pouvoir rotatoire, comptage particulaire. Qualifie et étalonne les équipements associés.", "Impuretés élémentaires par ICP-MS/ICP-OES (ICH Q3D, Ph. Eur. 2.4.20), caractérisation de l'état solide (DRX, DSC), choix de la technique la plus adaptée à un attribut qualité."], ["Validation, vérification et transfert de méthodes", "Exécute des essais de validation selon un protocole approuvé. Connaît les caractéristiques de performance d'ICH Q2(R2).", "Rédige protocoles et rapports. Calcule linéarité, exactitude, répétabilité, fidélité intermédiaire, limites de détection et de quantification. Réalise la vérification d'une méthode de pharmacopée (USP <1226>) et un transfert par essais comparatifs (USP <1224>).", "Définit la stratégie de validation fondée sur le risque et le profil cible analytique (ICH Q14). Gère les changements post-validation et la revalidation, fixe les critères d'acceptation, arbitre les échecs de validation."], ["Résultats hors spécifications et hors tendance (OOS / OOT), déviations, CAPA", "Alerte immédiatement son responsable, conserve les préparations et la verrerie, ne relance aucune analyse sans autorisation. Renseigne la liste de vérification de phase I.", "Mène l'investigation laboratoire (phase I), formule et teste des hypothèses, rédige le rapport, distingue cause assignable et cause non identifiée. Suit les tendances de stabilité et détecte les résultats hors tendance.", "Pilote les investigations élargies avec la production et l'assurance qualité, définit le plan de réanalyse, évalue l'impact sur les lots, conçoit et vérifie l'efficacité des CAPA, anime les revues de tendances."], ["Études de stabilité", "Sort les échantillons aux échéances, réalise les analyses, respecte les délais d'analyse.", "Gère le planning et les enceintes climatiques (ICH Q1A(R2) : 25 °C/60 % HR, 30 °C/65 % HR, 40 °C/75 % HR), traite les excursions, analyse les tendances.", "Conçoit les protocoles (plans réduits par extrêmes ou par matrice), exploite statistiquement les données pour la durée de conservation (ICH Q1E), rédige les sections du dossier d'AMM."], ["Qualification des équipements et métrologie", "Réalise les vérifications quotidiennes (balance, pH-mètre), respecte les statuts d'étalonnage.", "Exécute QI, QO et QP selon USP <1058> et l'Annexe 15, traite les non-conformités métrologiques et évalue leur impact sur les résultats antérieurs.", "Rédige les cahiers des charges utilisateur, pilote l'achat et la qualification d'un parc, valide les systèmes informatisés du laboratoire (GAMP 5)."], ["Systèmes informatisés du laboratoire", "Utilise un logiciel de chromatographie (Empower, Chromeleon, OpenLab) et le LIMS pour saisir et consulter des résultats.", "Crée méthodes de traitement et rapports, revoit les audit trails, gère les demandes de modification.", "Administre le système (profils, droits, sauvegardes), définit les règles d'intégration, pilote un projet de déploiement LIMS ou de cahier de laboratoire électronique."], ["Savoir-être, communication et encadrement", "Rigueur, respect des consignes, remontée immédiate des anomalies, travail en équipe.", "Planifie son activité, forme les nouveaux arrivants, communique clairement avec l'assurance qualité et la production.", "Encadre une équipe, gère les priorités de libération, présente en audit, conseille le client et propose des améliorations (lean laboratoire)."]]}, {"t": "h1", "v": "3. Techniques et activités de laboratoire"}, {"t": "table", "h": ["Technique", "Principe", "Usages en CQ", "Points de vigilance", "Références"], "r": [["HPLC / UPLC", "Séparation en phase liquide sous pression ; détection UV/DAD le plus souvent.", "Dosage, substances apparentées, uniformité de teneur, dosage des essais de dissolution.", "Conformité du système, qualité de la phase mobile, intégration, état de la colonne.", "Ph. Eur. 2.2.29 et 2.2.46 ; USP <621>"], ["GC (espace de tête, FID)", "Séparation en phase gazeuse de composés volatils.", "Solvants résiduels, impuretés volatiles, certains dosages.", "Étanchéité, équilibre de l'espace de tête, propreté du liner.", "Ph. Eur. 2.2.28 et 2.4.24 ; USP <467> ; ICH Q3C"], ["Dissolution", "Mesure de la vitesse de libération du principe actif dans un milieu à 37 °C.", "Libération des formes orales solides, profils comparatifs.", "Dégazage, température, géométrie, prélèvement et filtration.", "Ph. Eur. 2.9.3 ; USP <711>"], ["Spectrophotométrie UV-Visible", "Absorption de la lumière proportionnelle à la concentration.", "Dosages simples, lecture des essais de dissolution, identification.", "Zone de linéarité, propreté des cuves, blanc.", "Ph. Eur. 2.2.25 ; USP <857>"], ["Spectrophotométrie infrarouge", "Empreinte vibrationnelle de la molécule.", "Identification des matières premières et principes actifs.", "Préparation de l'échantillon, polymorphisme, spectre de référence.", "Ph. Eur. 2.2.24 ; USP <197>"], ["Karl Fischer", "Titrage spécifique de l'eau (volumétrique ou coulométrique).", "Teneur en eau des matières et produits finis.", "Humidité ambiante, dérive, titre du réactif.", "Ph. Eur. 2.5.12 et 2.5.32 ; USP <921>"], ["Titrimétrie, pH, conductivité", "Mesures électrochimiques et volumétriques.", "Dosage de matières premières, contrôle de l'eau et des solutions.", "Étalonnage des électrodes, titre des solutions.", "Ph. Eur. 2.2.3, 2.2.20 et 2.2.38"], ["Essais pharmacotechniques", "Désagrégation, dureté, friabilité, uniformité de masse.", "Contrôle des comprimés et gélules.", "Nombre d'unités, étalonnage des appareils.", "Ph. Eur. 2.9.1, 2.9.5, 2.9.7, 2.9.8 et 2.9.40"]]}], "grille": [{"t": "p", "v": "Candidat : ____________________   Poste visé : ____________________   Évaluateur : ____________________   Date : ____________"}, {"t": "h1", "v": "Barème"}, {"t": "table", "h": ["Note", "Signification"], "r": [["0", "Aucune connaissance ou réponse erronée"], ["1", "Notions partielles, pas d'exemple vécu"], ["2", "Réponse correcte mais scolaire"], ["3", "Réponse complète, illustrée par l'expérience"], ["4", "Maîtrise experte : nuance, références réglementaires, recul"]]}, {"t": "h1", "v": "Questions"}, {"t": "table", "h": ["#", "Domaine", "Niveau", "Question", "Éléments de réponse attendus", "Signaux d'alerte", "Coef.", "Note /4"], "r": [["1", "BPF et intégrité des données", "Junior", "Que signifie ALCOA+ et comment l'appliquez-vous dans votre travail quotidien ?", "Attribuable, Lisible, Contemporain, Original, Exact ; + Complet, Cohérent, Durable, Disponible. Exemples concrets : saisie en temps réel, identifiant personnel, pas de brouillon.", "Récite l'acronyme sans exemple ; trouve normal de recopier ses résultats au propre.", "2", ""], ["2", "BPF et intégrité des données", "Junior", "Vous faites une erreur d'écriture dans un cahier de laboratoire. Que faites-vous ?", "Rature d'un seul trait laissant l'original lisible, valeur corrigée, date, visa et motif. Jamais de correcteur ni de surcharge.", "Efface, surcharge ou arrache la page.", "1", ""], ["3", "BPF et intégrité des données", "Confirmé", "Que vérifiez-vous lors de la revue d'un audit trail de séquence chromatographique ?", "Injections interrompues ou non traitées, retraitements et intégrations manuelles justifiés, modifications de méthode, suppressions, cohérence horodatage/utilisateur, injections « d'essai » non déclarées.", "Ne sait pas où trouver l'audit trail ; pense que la revue relève uniquement de l'assurance qualité.", "3", ""], ["4", "HPLC", "Junior", "Quels sont les paramètres de conformité du système et à quoi servent-ils ?", "Résolution, facteur de symétrie, nombre de plateaux, répétabilité des injections (écart-type relatif), rapport signal/bruit. Ils prouvent que le système est apte le jour de l'analyse, avant tout résultat.", "Confond conformité du système et validation de méthode.", "2", ""], ["5", "HPLC", "Confirmé", "La pression de votre système HPLC monte brutalement en cours de séquence. Quelle est votre démarche ?", "Isoler le composant par déconnexions successives de l'aval vers l'amont (colonne, précolonne, fritté, capillaires, filtre en ligne) ; vérifier précipitation de tampon et miscibilité des solvants ; rinçage. Évaluer la validité des injections déjà réalisées.", "Change la colonne d'emblée sans diagnostic ; ne s'interroge pas sur les résultats déjà acquis.", "3", ""], ["6", "HPLC", "Confirmé", "Le temps de rétention dérive progressivement au fil des injections. Quelles causes envisagez-vous ?", "Composition ou pH de la phase mobile (évaporation, tampon mal préparé), température de colonne, équilibrage insuffisant, débit ou fuite, vieillissement de la colonne.", "Ne cite qu'une seule cause ; propose de modifier la fenêtre d'intégration sans chercher.", "2", ""], ["7", "HPLC", "Confirmé", "Jusqu'où pouvez-vous ajuster une méthode de pharmacopée sans la revalider ?", "Ajustements encadrés par Ph. Eur. 2.2.46 / USP <621> : rapport L/dp de la colonne (−25 % à +50 % en isocratique), débit, température de colonne, pH (± 0,2), concentration du tampon (± 10 %), composant minoritaire de la phase mobile (± 30 % relatif, 10 % absolu au plus). La conformité du système doit rester satisfaite. Au-delà : modification de méthode, donc validation.", "Pense qu'aucun ajustement n'est permis, ou au contraire que tout est permis si la conformité du système passe.", "3", ""], ["8", "HPLC", "Senior", "Comment démontrez-vous qu'une méthode est indicatrice de stabilité ?", "Dégradations forcées (acide, base, oxydation, chaleur, lumière selon ICH Q1B) visant une dégradation limitée ; séparation des produits de dégradation du principe actif ; pureté de pic (DAD ou spectrométrie de masse) ; bilan massique.", "Se limite à l'absence d'interférence du placebo.", "3", ""], ["9", "GC", "Junior", "Pourquoi utilise-t-on l'espace de tête pour doser les solvants résiduels ?", "Seuls les composés volatils sont injectés : la matrice non volatile ne contamine ni l'injecteur ni la colonne. Détection FID. Référence : ICH Q3C, Ph. Eur. 2.4.24, USP <467>.", "Ne connaît pas le principe de l'équilibre liquide-vapeur.", "1", ""], ["10", "GC", "Confirmé", "Comment sont classés les solvants résiduels et quelle limite s'applique à un solvant de classe 3 ?", "Classe 1 : à éviter (benzène…). Classe 2 : à limiter, limites fondées sur l'exposition journalière admissible (méthanol, acétonitrile…). Classe 3 : faible toxicité, 5 000 ppm (0,5 %) sans justification.", "Ne connaît pas ICH Q3C.", "2", ""], ["11", "Dissolution", "Junior", "Décrivez les étapes critiques d'un essai de dissolution à la palette.", "Milieu dégazé et volume exact, 37 ± 0,5 °C, vitesse vérifiée, hauteur de palette, introduction des unités, prélèvement dans la zone prescrite au temps exact (tolérance ± 2 %), filtration validée, compensation du volume si nécessaire.", "Oublie le dégazage ou la température ; ne mentionne pas la filtration.", "2", ""], ["12", "Dissolution", "Confirmé", "Expliquez les niveaux S1, S2 et S3 pour une forme à libération immédiate.", "S1 : 6 unités, chacune ≥ Q + 5 %. S2 : 6 unités de plus, moyenne des 12 ≥ Q et aucune < Q − 15 %. S3 : 12 unités de plus, moyenne des 24 ≥ Q, 2 unités au plus < Q − 15 %, aucune < Q − 25 %. Passer en S2 est prévu par la pharmacopée : ce n'est pas un résultat hors spécifications.", "Considère tout passage en S2 comme un OOS, ou ignore les critères individuels.", "3", ""], ["13", "Dissolution", "Senior", "Comment rendez-vous une méthode de dissolution discriminante ?", "Choix du milieu et du pH selon la solubilité, conditions sink, vitesse d'agitation modérée, tensioactif au minimum nécessaire ; démonstration sur des lots volontairement modifiés (granulométrie, force de compression, liant) ; comparaison des profils par f2.", "Choisit les conditions qui donnent 100 % le plus vite.", "2", ""], ["14", "Spectrophotométrie", "Junior", "Énoncez la loi de Beer-Lambert et ses limites.", "A = ε·l·c. Valable en solution diluée, en lumière monochromatique, sans interaction entre molécules ; travailler dans la zone linéaire de l'appareil (absorbances ni trop faibles ni trop fortes).", "Ne connaît pas la relation ou mesure des absorbances supérieures à 2 sans diluer.", "1", ""], ["15", "Spectrophotométrie", "Confirmé", "Quels contrôles réalisez-vous pour qualifier un spectrophotomètre UV-Visible ?", "Exactitude en longueur d'onde, exactitude en absorbance, lumière parasite, résolution, selon Ph. Eur. 2.2.25 / USP <857>, avec des matériaux de référence certifiés.", "Ne cite que le blanc.", "2", ""], ["16", "Autres techniques", "Junior", "Quand choisir un Karl Fischer coulométrique plutôt que volumétrique ?", "Coulométrique pour les faibles teneurs en eau (traces à environ 1 %), volumétrique pour les teneurs plus élevées. Vérification du titre ou de l'appareil avec un étalon d'eau ; attention aux réactions parasites (aldéhydes, cétones).", "Ne connaît pas la différence de principe.", "1", ""], ["17", "Validation", "Junior", "Quelles caractéristiques de performance sont évaluées lors de la validation d'un dosage par HPLC ?", "Spécificité, linéarité et intervalle, exactitude, fidélité (répétabilité et fidélité intermédiaire). Limites de détection et de quantification pour les impuretés. Robustesse étudiée au développement. Référence : ICH Q2(R2).", "Confond exactitude et fidélité.", "2", ""], ["18", "Validation", "Confirmé", "Quel plan d'essais minimal ICH Q2 prévoit-il pour l'exactitude et la répétabilité ?", "Exactitude : au moins 9 déterminations sur 3 niveaux de concentration couvrant l'intervalle. Répétabilité : au moins 9 déterminations sur l'intervalle, ou 6 à 100 %. Linéarité : au moins 5 niveaux.", "Ne connaît pas les nombres minimaux ; propose une seule préparation par niveau.", "3", ""], ["19", "Validation", "Confirmé", "Comment déterminez-vous les limites de détection et de quantification ?", "Rapport signal/bruit (environ 3 pour la détection, 10 pour la quantification), ou calcul à partir de l'écart-type de la réponse et de la pente (3,3 σ/S et 10 σ/S). La limite de quantification est ensuite confirmée expérimentalement en exactitude et fidélité.", "Ne confirme pas expérimentalement la limite de quantification.", "2", ""], ["20", "Validation", "Confirmé", "Quelle différence faites-vous entre validation, vérification et transfert ?", "Validation : démonstration complète pour une méthode nouvelle ou modifiée (ICH Q2). Vérification : aptitude d'une méthode de pharmacopée dans les conditions du laboratoire (USP <1226>). Transfert : qualification d'un laboratoire receveur par essais comparatifs, co-validation, revalidation ou dispense justifiée (USP <1224>).", "Revalide intégralement une méthode de pharmacopée, ou l'applique sans aucune vérification.", "3", ""], ["21", "Validation", "Senior", "Qu'apportent ICH Q14 et la révision Q2(R2) à votre pratique ?", "Profil cible analytique, approche renforcée du développement, robustesse étudiée en amont, conditions établies facilitant les changements post-approbation. Q2(R2) couvre les méthodes multivariées et introduit la notion d'intervalle de réponse (étalonnage non linéaire admis). En vigueur dans l'UE depuis juin 2024.", "N'a pas connaissance de la révision.", "2", ""], ["22", "Validation", "Senior", "Un essai de fidélité intermédiaire échoue en cours de validation. Que faites-vous ?", "Ouvrir une déviation, ne pas écarter le résultat ; investiguer (analyste, appareil, colonne, préparation) ; déterminer si le défaut tient à l'exécution ou à la méthode ; amender le protocole avant toute reprise ; tout documenter dans le rapport.", "Refait l'essai jusqu'à obtenir un résultat conforme.", "3", ""], ["23", "OOS / OOT", "Junior", "Vous obtenez un résultat hors spécifications. Quels sont vos premiers gestes ?", "Ne rien jeter (préparations, flacons, verrerie), ne rien réinjecter de sa propre initiative, prévenir immédiatement le responsable, ouvrir l'investigation et renseigner la liste de vérification de phase I.", "Refait l'analyse immédiatement « pour vérifier ».", "3", ""], ["24", "OOS / OOT", "Confirmé", "Que couvre une investigation de phase I au laboratoire ?", "Calculs et transcriptions, méthode appliquée, étalons et réactifs (péremption, préparation), équipement (étalonnage, conformité du système), échantillon (identité, conservation, préparation), formation de l'analyste, examen des préparations conservées. Réinjection ou tests d'hypothèse uniquement selon un plan approuvé. Conclusion : cause assignable ou non.", "Ne distingue pas réinjection, réanalyse et rééchantillonnage.", "3", ""], ["25", "OOS / OOT", "Confirmé", "Dans quels cas pouvez-vous invalider un résultat hors spécifications ?", "Uniquement si une cause assignable au laboratoire est démontrée et documentée. Sans cause identifiée, le résultat initial reste valide et doit figurer au dossier ; la décision sur le lot revient à l'unité qualité, après investigation de phase II.", "Invalide sur la base d'une réanalyse conforme (« testing into compliance ») ou d'une moyenne.", "3", ""], ["26", "OOS / OOT", "Senior", "Pourquoi ne peut-on pas faire la moyenne d'un résultat hors spécifications et de résultats conformes ?", "La moyenne masque la variabilité et le résultat non conforme (guide FDA sur les OOS). Elle n'est admise que si la méthode prévoit que le résultat rapportable est une moyenne de répétitions d'une même préparation. Les tests de valeurs aberrantes ne permettent pas d'invalider un résultat de dosage chimique.", "Propose la moyenne ou un test statistique d'aberrance pour libérer le lot.", "3", ""], ["27", "OOS / OOT", "Senior", "Comment détectez-vous et traitez-vous un résultat hors tendance en stabilité ?", "Définition préalable dans une procédure : limites issues de l'historique (cartes de contrôle, intervalles de prédiction de la régression, comparaison de pentes entre lots). Résultat conforme mais atypique : investigation analogue à la phase I, évaluation du risque de sortie de spécifications avant péremption, information de l'assurance qualité (EU GMP chapitre 6, points 6.9 et 6.35).", "Considère qu'un résultat conforme ne nécessite aucune action.", "3", ""], ["28", "Stabilité et savoir-être", "Confirmé", "Une enceinte climatique sort de ses tolérances pendant un week-end. Comment gérez-vous ?", "Déviation, reconstitution de la durée et de l'amplitude à partir des enregistrements, évaluation d'impact produit par produit (durée cumulée, condition, sensibilité), décision documentée, action corrective (alarme, astreinte, maintenance).", "Ignore l'excursion parce que l'enceinte est revenue dans les tolérances.", "2", ""]]}, {"t": "p", "v": "Score pondéré = Σ (note × coefficient) ; maximum = 260. Repères : < 50 % non retenu ; 50–70 % junior ; 70–85 % confirmé ; > 85 % senior (à croiser avec l'expérience)."}], "support": [{"t": "h1", "v": "Partie 1 – Investigations des résultats hors spécifications (OOS) et hors tendance (OOT)"}, {"t": "h2", "v": "1.1 Définitions"}, {"t": "table", "h": ["Terme", "Définition", "Exemple"], "r": [["OOS (hors spécifications)", "Résultat qui sort des critères d'acceptation enregistrés (dossier d'AMM, pharmacopée, spécification interne).", "Dosage à 94,2 % pour une spécification de 95,0 à 105,0 %"], ["OOT (hors tendance)", "Résultat conforme mais qui s'écarte de l'évolution attendue au vu de l'historique du produit ou de l'étude.", "Impureté passant de 0,10 % à 0,25 % entre 12 et 18 mois, pour une limite de 0,5 %"], ["Résultat atypique ou inattendu", "Résultat conforme, sans historique permettant de parler de tendance, mais surprenant.", "Dosage à 104,8 % alors que les lots précédents sont entre 99 et 101 %"], ["Cause assignable", "Erreur démontrée et documentée expliquant le résultat (laboratoire, échantillonnage, fabrication).", "Fiole de 50 mL utilisée à la place de 100 mL, tracée au cahier"]]}, {"t": "h2", "v": "1.2 Référentiels"}, {"t": "ul", "v": ["FDA – Guidance for Industry « Investigating Out-of-Specification (OOS) Test Results for Pharmaceutical Production » (octobre 2006, révisée en mai 2022) ; 21 CFR 211.160, 211.165 et 211.192.", "EU GMP Partie I, chapitre 6 : enregistrement permettant le suivi des tendances et investigation de tout résultat hors spécifications ou hors tendance (6.9), validation des méthodes (6.15), résultats de stabilité hors spécifications ou tendances atypiques et déclaration aux autorités (6.35), transfert de méthodes (6.37 à 6.41). Chapitre 1 pour les investigations et les CAPA.", "MHRA – « Out of Specification & Out of Trend Investigations » : phases Ia, Ib, II et III.", "ICH Q10 (système qualité pharmaceutique) et ICH Q9(R1) (gestion du risque qualité) ; ICH Q1E pour l'évaluation des données de stabilité."]}, {"t": "h2", "v": "1.3 Déroulement d'une investigation OOS"}, {"t": "table", "h": ["Phase", "Qui", "Contenu", "Issue"], "r": [["Phase Ia – erreur évidente", "Analyste, responsable de laboratoire", "Erreur manifeste : calcul, coupure de courant, renversement, panne d'appareil, mauvais paramètre.", "Résultat invalidé, analyse reprise, erreur documentée"], ["Phase Ib – investigation laboratoire", "Analyste, responsable de laboratoire", "Liste de vérification complète : méthode, calculs, étalons, réactifs, verrerie, appareil, conformité du système, échantillon, formation. Examen des préparations conservées. Tests d'hypothèse selon plan approuvé.", "Cause assignable : résultat invalidé et réanalyse. Sinon : phase II"], ["Phase II – investigation élargie", "Assurance qualité, production, laboratoire", "Revue du dossier de lot, des déviations, des matières, des équipements de fabrication. Plan de réanalyse approuvé par l'assurance qualité : nombre d'essais fixé à l'avance, second analyste. Rééchantillonnage seulement si l'échantillon initial n'est pas représentatif.", "Cause procédé : OOS confirmé. Aucune cause : le résultat initial reste valide"], ["Phase III – décision et impact", "Unité qualité", "Décision sur le lot, impact sur les autres lots et produits, information des autorités et du titulaire d'AMM si nécessaire, CAPA et vérification d'efficacité.", "Rejet, libération justifiée, retraitement ; clôture"]]}, {"t": "h2", "v": "1.4 Liste de vérification de phase I"}, {"t": "ul", "v": ["Échantillon : identité, étiquetage, intégrité du contenant, conditions et durée de conservation, homogénéité.", "Méthode : version en vigueur, étapes suivies sans écart, paramètres instrumentaux conformes.", "Pesées et dilutions : balance adaptée et étalonnée, pesée minimale respectée, verrerie de classe A et de bon volume, tickets de pesée.", "Étalons et réactifs : lot, pureté, facteur de correction, péremption, conservation ; phase mobile et tampons (pH, date de préparation).", "Appareil : statut d'étalonnage et de qualification, journal de bord, maintenance récente, conformité du système réussie avant, pendant et après la séquence.", "Données brutes : intégration, identification des pics, formule de calcul, transcriptions, audit trail.", "Analyste : habilitation à la méthode, charge de travail, événement inhabituel pendant l'analyse.", "Préparations conservées : examen visuel (insolubles, coloration), réinjection de la même solution si le plan le prévoit."]}, {"t": "h2", "v": "1.5 Règles à ne pas enfreindre"}, {"t": "ul", "v": ["Ne jamais jeter les préparations avant la fin de l'évaluation initiale.", "Ne jamais répéter l'analyse jusqu'à obtenir un résultat conforme (« testing into compliance »). Le nombre de réanalyses est fixé avant de commencer.", "Ne jamais invalider un résultat sans cause assignable démontrée.", "Ne pas moyenner un résultat hors spécifications avec des résultats conformes pour le faire disparaître.", "Ne pas utiliser un test de valeurs aberrantes pour écarter un résultat de dosage chimique.", "Rapporter tous les résultats, y compris ceux qui sont invalidés, avec leur justification.", "Respecter le délai de clôture fixé par la procédure (souvent 30 jours calendaires) ou justifier son dépassement."]}, {"t": "h2", "v": "1.6 Résultats hors tendance (OOT)"}, {"t": "p", "v": "La détection d'un OOT suppose des règles écrites à l'avance. Trois familles d'outils sont utilisées, seules ou combinées."}, {"t": "table", "h": ["Outil", "Principe", "Usage"], "r": [["Cartes de contrôle", "Limites à ± 3 écarts-types autour de la moyenne historique, complétées par des règles de séries (plusieurs points consécutifs du même côté, dérive continue).", "Résultats de libération, attributs stables d'un lot à l'autre"], ["Intervalle de prédiction de la régression", "Droite de régression de l'attribut en fonction du temps ; un nouveau point hors de l'intervalle de prédiction est hors tendance.", "Suivi d'un lot en stabilité"], ["Comparaison des pentes", "La pente du lot est comparée à la distribution des pentes des lots historiques.", "Stabilité, détection d'une dégradation accélérée"], ["Écart entre échéances", "Variation entre deux points consécutifs comparée à la variation habituelle.", "Règle simple en début d'étude, quand les points sont peu nombreux"]]}, {"t": "p", "v": "Un OOT déclenche une investigation de même nature que la phase I. Si le résultat est confirmé, on évalue par projection la probabilité de sortir des spécifications avant la péremption, ainsi que l'impact sur les lots commercialisés. Un résultat de stabilité hors spécifications ou une tendance négative significative sur un lot commercialisé doit être signalé aux autorités compétentes (EU GMP 6.35)."}, {"t": "h2", "v": "1.7 Causes fréquentes observées en laboratoire"}, {"t": "table", "h": ["Technique", "Causes fréquentes"], "r": [["HPLC", "Étalon mal pesé ou facteur de pureté erroné, dilution incorrecte, extraction incomplète (temps d'ultrasons, solvant), intégration inadaptée, colonne en fin de vie, évaporation de la phase mobile, contamination croisée du passeur."], ["Dissolution", "Milieu non dégazé, température hors tolérance, vibration, position du prélèvement, adsorption sur le filtre, cône sous la palette, flottaison des gélules sans plombage."], ["Karl Fischer", "Reprise d'humidité pendant la pesée, dérive non stabilisée, titre non vérifié, réaction parasite."], ["GC", "Fuite au septum, flacon mal serti, temps d'équilibre insuffisant, contamination par les solvants du laboratoire."], ["Échantillonnage", "Prélèvement non représentatif, ségrégation du mélange, mauvais contenant, conservation inadaptée."]]}, {"t": "h2", "v": "1.8 Contenu du rapport d'investigation"}, {"t": "ul", "v": ["Description factuelle de l'événement et résultat initial.", "Hypothèses examinées, essais réalisés, résultats obtenus.", "Cause racine (méthode des 5 pourquoi, diagramme d'Ishikawa) ou mention explicite « cause non identifiée ».", "Évaluation d'impact : lot concerné, autres lots, autres produits, analyses antérieures.", "Décision sur le résultat et sur le lot, avec signature de l'unité qualité.", "CAPA : action, responsable, échéance, critère de vérification d'efficacité."]}, {"t": "h1", "v": "Partie 2 – Validation des méthodes analytiques"}, {"t": "h2", "v": "2.1 Référentiels"}, {"t": "ul", "v": ["ICH Q2(R2) « Validation of Analytical Procedures » et ICH Q14 « Analytical Procedure Development » : adoptées en novembre 2023, applicables dans l'Union européenne depuis juin 2024.", "USP <1225> (validation), <1226> (vérification des méthodes de pharmacopée), <1224> (transfert), <1220> (cycle de vie de la procédure analytique).", "Ph. Eur. : prescriptions générales (une méthode de monographie est réputée validée ; son aptitude doit être vérifiée dans les conditions d'emploi) et chapitre 2.2.46 pour la chromatographie.", "EU GMP Partie I, chapitre 6 (6.15 : validation des méthodes ; 6.37 à 6.41 : transfert) et Annexe 15."]}, {"t": "h2", "v": "2.2 Caractéristiques à évaluer selon le type d'essai (ICH Q2)"}, {"t": "table", "h": ["Caractéristique", "Identification", "Impuretés – essai quantitatif", "Impuretés – essai limite", "Dosage, dissolution, teneur"], "r": [["Spécificité / sélectivité", "Oui", "Oui", "Oui", "Oui"], ["Intervalle : linéarité (réponse)", "Non", "Oui", "Non", "Oui"], ["Intervalle : limite basse", "Non", "Limite de quantification", "Limite de détection", "Non"], ["Exactitude", "Non", "Oui", "Non", "Oui"], ["Répétabilité", "Non", "Oui", "Non", "Oui"], ["Fidélité intermédiaire", "Non", "Oui", "Non", "Oui"]]}, {"t": "p", "v": "Note : La robustesse est étudiée pendant le développement (ICH Q14) ; ses conclusions fixent les paramètres de conformité du système."}, {"t": "h2", "v": "2.3 Plan d'essais minimal et critères usuels"}, {"t": "table", "h": ["Caractéristique", "Plan minimal (ICH Q2)", "Critères usuels pour un dosage HPLC (à fixer dans le protocole)"], "r": [["Spécificité", "Blanc, placebo, impuretés connues, échantillons dégradés ; pureté de pic.", "Aucune interférence au temps de rétention ; résolution ≥ 1,5 avec le pic voisin"], ["Linéarité", "Au moins 5 niveaux sur l'intervalle.", "Coefficient de corrélation ≥ 0,999 ; résidus sans tendance ; ordonnée à l'origine non significative"], ["Exactitude", "Au moins 9 déterminations sur 3 niveaux.", "Recouvrement moyen de 98,0 à 102,0 %"], ["Répétabilité", "9 déterminations sur l'intervalle ou 6 à 100 %.", "Écart-type relatif ≤ 2,0 % (souvent ≤ 1,0 %)"], ["Fidélité intermédiaire", "Variation des jours, analystes, appareils.", "Écart-type relatif global ≤ 2,0 % ; écart entre moyennes ≤ 2,0 %"], ["Limite de quantification", "Signal/bruit d'environ 10, ou 10 σ/S, puis confirmation expérimentale.", "Inférieure ou égale au seuil de déclaration ; écart-type relatif ≤ 10 %"], ["Limite de détection", "Signal/bruit d'environ 3, ou 3,3 σ/S.", "Pic visible et distinct du bruit"], ["Stabilité des solutions", "Étalon et essai à plusieurs temps, en conditions d'usage.", "Variation ≤ 2,0 % par rapport au temps initial"]]}, {"t": "h2", "v": "2.4 Intervalles à couvrir (ICH Q2(R2))"}, {"t": "table", "h": ["Essai", "Intervalle minimal"], "r": [["Dosage d'une substance ou d'un produit fini", "80 à 120 % de la teneur déclarée"], ["Uniformité de teneur", "70 à 130 % de la teneur déclarée"], ["Dissolution", "Au minimum ± 20 % autour de l'intervalle spécifié ; ICH Q2(R2) élargit cet intervalle (de la limite basse justifiée par la spécification jusqu'à 130 % de la teneur déclarée) : se reporter au tableau 2 du texte"], ["Impuretés", "Du seuil de déclaration à 120 % de la spécification"]]}, {"t": "h2", "v": "2.5 Les étapes d'une validation"}, {"t": "ul", "v": ["Vérifier les prérequis : méthode figée, appareils qualifiés, étalons caractérisés, analystes habilités.", "Rédiger le protocole : objet, caractéristiques, plan d'essais, critères d'acceptation, traitement statistique. Le faire approuver avant le premier essai.", "Exécuter les essais en respectant l'intégrité des données ; ouvrir une déviation pour tout écart.", "Exploiter les résultats et rédiger le rapport : conclusion sur l'aptitude de la méthode, limites d'emploi, critères de conformité du système retenus.", "Suivre la méthode en routine : tendances de la conformité du système, résultats hors spécifications liés à la méthode, revalidation en cas de changement."]}, {"t": "h2", "v": "2.6 Vérification et transfert"}, {"t": "table", "h": ["Situation", "Démarche", "Essais types"], "r": [["Méthode de pharmacopée", "Vérification de l'aptitude dans le laboratoire", "Spécificité vis-à-vis de la formulation, fidélité, limite de quantification pour les impuretés"], ["Transfert vers un autre laboratoire", "Essais comparatifs sur les mêmes lots, critères d'écart fixés à l'avance", "Dosage : écart entre moyennes ≤ 2 % ; impuretés : écart adapté au niveau"], ["Méthode en cours de validation", "Co-validation : le laboratoire receveur réalise la fidélité intermédiaire", "Reproductibilité inter-laboratoires"], ["Méthode simple, laboratoire expérimenté", "Dispense de transfert justifiée et documentée", "Aucun, justification écrite"]]}, {"t": "h2", "v": "2.7 Quand revalider ?"}, {"t": "ul", "v": ["Changement de synthèse de la substance active ou de composition du produit fini.", "Modification de la méthode au-delà des ajustements permis par la pharmacopée.", "Changement de type d'appareil ou de principe de détection.", "Dérive répétée de la conformité du système ou résultats hors spécifications attribués à la méthode.", "L'étendue de la revalidation est proportionnée au changement et justifiée par une analyse de risque."]}, {"t": "h2", "v": "2.8 Erreurs fréquentes"}, {"t": "ul", "v": ["Critères d'acceptation fixés après avoir vu les résultats.", "Spécificité démontrée sans échantillons dégradés.", "Linéarité jugée sur le seul coefficient de corrélation, sans examen des résidus.", "Limite de quantification calculée mais jamais confirmée par des essais.", "Fidélité intermédiaire réalisée par le même analyste, le même jour.", "Stabilité des solutions non étudiée, alors que les séquences durent plus de 24 heures.", "Essai échoué répété sans déviation ni investigation."]}]};
const S = DATA.sheets;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const col = (sheet, name) => S[sheet].h.indexOf(name);
const ZONES = S["Synthèse zones"].r.filter(r => r[0] !== "TOTAL").map(r => r[0]);
const TOTAL = S["Synthèse zones"].r.find(r => r[0] === "TOTAL");
const badge = (v, map) => `<span class="badge ${map[v] || "bC"}">${esc(v)}</span>`;
const PRIO = {A:"bA",B:"bB",C:"bC"}, FIAB = {A:"bA",B:"bB",C:"bR"};

const TABS = [
  ["apercu","Vue d'ensemble"],["synthese","Synthèse"],["entreprises","Entreprises",S.Entreprises.r.length],
  ["contacts","Contacts",S.Contacts.r.length],["offres","Offres",S.Offres.r.length],["cabinets","Offres cabinets",S["Offres cabinets"].r.length],
  ["referentiel","Référentiel"],["grille","Grille d'entretien"],["support","OOS/OOT & validation"],["methode","Méthode"],["fichiers","Fichiers"]

  tabsEl.insertAdjacentHTML("beforeend", `<button class="tab" role="tab" id="t-${id}" aria-controls="p-${id}" data-tab="${id}">${label}${n ? `<span class="count">${n}</span>` : ""}</button>`);

const rendered = {};

  if (!TABS.some(t => t[0] === id)) id = "apercu";
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-" + id);
  if (!rendered[id]) { RENDER[id](document.getElementById("p-" + id)); rendered[id] = true; }
  const tb = document.getElementById("t-" + id); tabsEl.scrollTo({left: tb.offsetLeft - tabsEl.clientWidth / 2 + tb.clientWidth / 2, behavior: "smooth"});
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-go]");
  if (t) { e.preventDefault(); show(t.dataset.tab || t.dataset.go); window.scrollTo({top: 0}); }
});

/* ---------- tableau interactif générique ---------- */
function dataTable(el, sheet, cfg) {
  const {h, r} = S[sheet];
  const idx = cfg.cols.map(c => h.indexOf(c));
  const filters = (cfg.filters || []).map(f => ({name: f, i: h.indexOf(f), values: [...new Set(r.map(x => x[h.indexOf(f)]))].filter(Boolean)}));
  filters.forEach(f => { if (f.name === "Zone") f.values = ZONES.filter(z => f.values.includes(z)); else f.values.sort(); });
  el.insertAdjacentHTML("beforeend", `<div class="toolbar"><input type="search" placeholder="Rechercher (nom, entreprise, ville, intitulé…)" aria-label="Rechercher">${filters.map((f, k) => `<select data-f="${k}" aria-label="${esc(f.name)}"><option value="">${esc(f.name)} : tous</option>${f.values.map(v => `<option>${esc(v)}</option>`).join("")}</select>`).join("")}<span class="n"></span></div><div class="tw"><table><thead><tr>${cfg.cols.map((c, k) => `<th class="sort" data-k="${k}">${esc(cfg.labels?.[c] || c)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`);
  const tb = el.querySelector("tbody"), inp = el.querySelector("input"), cnt = el.querySelector(".n");
  let sortK = null, dir = 1;
  const fmt = (c, v, row) => (cfg.fmt?.[c] ? cfg.fmt[c](v, row) : esc(v));
  function draw() {
    const q = norm(inp.value).split(/\s+/).filter(Boolean);
    const fv = [...el.querySelectorAll("select")].map(s => s.value);
    let rows = r.filter(row => filters.every((f, k) => !fv[k] || row[f.i] === fv[k]) && q.every(w => norm(row.join(" ")).includes(w)));
    if (sortK !== null) {
      const i = idx[sortK];
      rows = rows.slice().sort((a, b) => (typeof a[i] === "number" && typeof b[i] === "number" ? a[i] - b[i] : String(a[i]).localeCompare(String(b[i]), "fr")) * dir);
    }
    tb.innerHTML = rows.map(row => `<tr>${cfg.cols.map((c, k) => `<td class="${cfg.cls?.[c] || ""}">${fmt(c, row[idx[k]], row)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cfg.cols.length}" class="muted">Aucun résultat.</td></tr>`;
    cnt.textContent = `${rows.length} / ${r.length}`;
  }
  inp.addEventListener("input", draw);
  el.querySelectorAll("select").forEach(s => s.addEventListener("change", draw));
  el.querySelectorAll("th.sort").forEach(th => th.addEventListener("click", () => {
    const k = +th.dataset.k; dir = sortK === k ? -dir : 1; sortK = k;
    el.querySelectorAll("th.sort").forEach(x => x.classList.remove("asc", "desc")); th.classList.add(dir > 0 ? "asc" : "desc"); draw();
  }));
  draw();
}
const link = (label) => v => v && String(v).startsWith("http") ? `<a href="${esc(v)}" target="_blank" rel="noopener">${label} ↗</a>` : "";

/* ---------- blocs Word ---------- */
let tocN = 0;
function blocks(list, toc) {
  return list.map(b => {
    if (b.t === "h1" || b.t === "h2") { const id = "s" + (++tocN); if (toc) toc.push([b.t, b.v, id]); return b.t === "h1" ? `<h2 id="${id}">${esc(b.v)}</h2>` : `<h3 id="${id}">${esc(b.v)}</h3>`; }
    if (b.t === "b") return `<h3>${esc(b.v)}</h3>`;
    if (b.t === "p") return `<p>${esc(b.v)}</p>`;
    if (b.t === "ul") return `<ul>${b.v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (b.t === "table") return `<div class="tw"><table><thead><tr>${b.h.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${b.r.map(r => `<tr>${r.map(x => `<td class="${String(x).length > 60 ? "wide" : ""}">${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return "";
  }).join("");
}
function docWithToc(el, list, title) {
  const toc = []; const html = blocks(list, toc);
  el.innerHTML = `<div class="layout"><nav class="toc" aria-label="Sommaire"><div class="lbl" style="margin-bottom:6px">${esc(title)}</div>${toc.map(([t, v, id]) => `<a class="${t === "h1" ? "l1" : ""}" href="#${id}">${esc(v)}</a>`).join("")}</nav><div class="doc">${html}</div></div>`;
  el.querySelectorAll(".toc a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(a.getAttribute("href").slice(1)).scrollIntoView({behavior: "smooth"}); }));
}

      ${S["Synthèse zones"].r.map(r => `<tr${r[0] === "TOTAL" ? ' style="font-weight:600"' : ""}><td>${esc(r[0])}</td><td class="mid muted">${esc(r[1])}</td><td><div class="bar">${r[0] === "TOTAL" ? "" : `<i style="width:${Math.round(80 * r[2] / max)}px"></i>`}<span>${r[2]}</span></div></td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td></tr>`).join("")}
      </tbody></table></div>
      <h2>Comptes prioritaires (A)</h2>
      <div class="grid two">${prioA.map(r => `<div class="card"><div class="qhead"><span class="chip">${esc(r[eI("Zone")])}</span><span class="badge bA">Priorité A</span></div><h3 style="margin:8px 0 2px">${esc(r[eI("Entreprise")])}</h3><div class="muted" style="font-size:13px">${esc(r[eI("Site(s)")])} · ${r[eI("Nb contacts")]} contact(s) · ${r[eI("Nb offres")]} offre(s)</div><p style="margin:8px 0 0;font-size:14px">${esc(r[eI("Signal de besoin")])}</p></div>`).join("")}</div>`;
  },
  synthese(el) { docWithToc(el, DATA.synthese, "Synthèse des opportunités"); },
  entreprises(el) {
    dataTable(el, "Entreprises", {
      cols: ["Zone", "Entreprise", "Priorité", "Type", "Site(s)", "Activité", "Nb contacts", "Nb offres", "Signal de besoin", "Recherche LinkedIn"],
      labels: {"Nb contacts": "Contacts", "Nb offres": "Offres", "Recherche LinkedIn": "LinkedIn"},
      filters: ["Zone", "Priorité", "Type"],
      cls: {"Activité": "mid", "Signal de besoin": "wide", "Entreprise": "mid", "Nb contacts": "num", "Nb offres": "num"},
      fmt: {"Priorité": v => badge(v, PRIO), "Zone": v => `<span class="chip">${esc(v)}</span>`, "Entreprise": v => `<b>${esc(v)}</b>`, "Recherche LinkedIn": link("Rechercher")}
    });
  },
  contacts(el) {
    el.insertAdjacentHTML("beforeend", `<p class="note" style="margin-top:0">Fiabilité A : fonction lue dans le titre du profil public · B : déduite d'une publication ou site non confirmé · C : à vérifier avant tout envoi.</p>`);
    dataTable(el, "Contacts", {
      cols: ["Nom", "Fonction", "Entreprise", "Localisation", "Zone", "Rôle", "Fiabilité", "Lien LinkedIn", "Source / remarque"],
      labels: {"Lien LinkedIn": "LinkedIn", "Source / remarque": "Source"},
      filters: ["Zone", "Fiabilité", "Rôle"],
      cls: {"Fonction": "mid", "Source / remarque": "mid", "Nom": "mid"},

    });
  },
  offres(el) {
    dataTable(el, "Offres", {
      cols: ["Zone", "Employeur", "Intitulé", "Ville", "Contrat", S.Offres.h[6], "Lien"],
      labels: {[S.Offres.h[6]]: "Publiée"}, filters: ["Zone", "Employeur", "Contrat"],
      cls: {"Intitulé": "wide", "Employeur": "mid"},

    });
  },
  cabinets(el) {
    el.insertAdjacentHTML("beforeend", `<p class="note" style="margin-top:0">Offres de cabinets et d'ESN : elles signalent un besoin chez un client de la zone et une concurrence directe.</p>`);
    const h = S["Offres cabinets"].h;

    });
  },
  referentiel(el) {
    const tables = DATA.referentiel.filter(b => b.t === "table");
    const [lev, comp, tech] = tables;
    el.innerHTML = `<h2>Niveaux d'expérience</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${lev.r.map((r, i) => `<div class="card"><span class="badge ${["bA", "bB", "bR"][i] || "bC"}">${esc(r[0])}</span> <span class="muted" style="font-size:13px">${esc(r[1])}</span><p style="margin:8px 0 0">${esc(r[2])}</p></div>`).join("")}</div>
      <h2>Compétences par domaine</h2><div class="toolbar"><select id="lvl" aria-label="Niveau"><option value="">Tous les niveaux</option>${comp.h.slice(1).map((x, i) => `<option value="${i + 1}">${esc(x)}</option>`).join("")}</select></div><div id="comp"></div>
      <h2>Techniques et activités de laboratoire</h2>${blocks([tech])}`;
    const drawC = () => {

    };
    el.querySelector("#lvl").addEventListener("change", drawC); drawC();
  },
  grille(el) {
    const tbls = DATA.grille.filter(b => b.t === "table");
    const bar = tbls[0], g = tbls.find(t => t.h.includes("Question"));
    const H = n => g.h.indexOf(n);
    const doms = [...new Set(g.r.map(r => r[H("Domaine")]))], lv = [...new Set(g.r.map(r => r[H("Niveau")]))];
    const notes = {};
    el.innerHTML = `<p class="muted" style="margin-top:0">Notez chaque réponse de 0 à 4 : le score pondéré se calcule en direct (rien n'est enregistré). Barème : ${bar.r.map(r => `<b>${esc(r[0])}</b> ${esc(r[1])}`).join(" · ")}.</p>
      <div class="sticky"><div class="toolbar" style="margin:0"><select id="gd" aria-label="Domaine"><option value="">Tous les domaines</option>${doms.map(d => `<option>${esc(d)}</option>`).join("")}</select><select id="gl" aria-label="Niveau"><option value="">Tous les niveaux</option>${lv.map(d => `<option>${esc(d)}</option>`).join("")}</select><button class="btn ghost" id="greset" type="button">Réinitialiser les notes</button><span class="n" id="gscore"></span></div><div class="meter"><i id="gm"></i></div></div>
      <div id="gq" class="grid"></div>`;
    const score = () => {
      let s = 0, m = 0, n = 0;
      g.r.forEach((r, i) => { if (notes[i] !== undefined) { const c = +r[H("Coef.")] || 1; s += notes[i] * c; m += 4 * c; n++; } });

      const lvl = !n ? "" : p < 50 ? "non retenu" : p < 70 ? "junior" : p < 85 ? "confirmé" : "senior";
      el.querySelector("#gscore").textContent = n ? `${n} question(s) notée(s) · ${s} / ${m} · ${p} % → ${lvl}` : "Aucune note";
      el.querySelector("#gm").style.width = p + "%";
    };
    const draw = () => {
      const d = el.querySelector("#gd").value, l = el.querySelector("#gl").value;
      el.querySelector("#gq").innerHTML = g.r.map((r, i) => (d && r[H("Domaine")] !== d) || (l && r[H("Niveau")] !== l) ? "" : `
        <div class="card q"><div class="qhead"><span class="chip">Q${esc(r[0])}</span><span class="chip">${esc(r[H("Domaine")])}</span>${badge(r[H("Niveau")], {Junior: "bA", "Confirmé": "bB", Senior: "bR"})}<span class="muted" style="font-size:12px">coef. ${esc(r[H("Coef.")])}</span>

    });
    el.querySelector("#gd").addEventListener("change", draw); el.querySelector("#gl").addEventListener("change", draw);
    el.querySelector("#greset").addEventListener("click", () => { Object.keys(notes).forEach(k => delete notes[k]); draw(); score(); });
